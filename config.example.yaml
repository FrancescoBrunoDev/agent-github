# Agent configuration
listen_addr: ":9423"
webhook_path: "/webhook"
max_workers: 5
media_dir: "./media"
preview_dir: "./preview"
base_url: "https://agent.francesco-bruno.com"

github:
  app_id: 0
  installation_id: 0
  private_key_file: "/etc/agent/github-app.pem"
  webhook_secret: ""
  # Bot user for actions the GitHub App cannot perform (issue assignment, etc.)
  # Create a machine user account (e.g. @agent-bot), add it as repo collaborator,
  # and generate a classic PAT with repo scope.
  # bot_user: "agent-bot"
  # bot_token: "ghp_..."

queue:
  type: memory

pi:
  settings:
    default_provider: anthropic
    default_model: claude-sonnet-4-20250514
    default_thinking_level: medium
  # models: |
  #   { ... }
  # auth: |
  #   {
  #     "provider-name": {
  #       "type": "api_key",
  #       "key": "sk-..."
  #     }
  #   }

# Per-repository configuration overrides.
# Key = owner/repo (exact match against the webhook payload).
repos:
