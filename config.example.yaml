# Agent configuration
listen_addr: ":9423"
webhook_path: "/webhook"
max_workers: 5
media_dir: "./media"
preview_dir: "./preview"
base_url: "https://agent.francesco-bruno.com"

github:
  app_id: 0
  installation_id: 0
  private_key_file: "/etc/agent/github-app.pem"
  webhook_secret: ""
  # Bot user for actions the GitHub App cannot perform (issue assignment, etc.)
  # Create a machine user account (e.g. @agent-bot), add it as repo collaborator,
  # and generate a classic PAT with repo scope.
  # bot_user: "agent-bot"
  # bot_token: "ghp_..."

# Gitea configuration (optional — for self-hosted or gitea.com instances).
# Gitea uses personal access tokens (PAT) instead of GitHub App auth.
# Generate a token at: <your-gitea>/user/settings/applications
# Token needs: read:repository, write:issue, write:repository scopes.
gitea:
  base_url: ""          # e.g. https://gitea.example.com
  token: ""             # Personal access token
  webhook_secret: ""    # HMAC secret for webhook verification
  # bot_user: "agent-bot"   # Gitea username of the bot account
  # bot_token: "..."        # PAT for the bot user (falls back to token if empty)

queue:
  type: memory

pi:
  settings:
    default_provider: anthropic
    default_model: claude-sonnet-4-20250514
    default_thinking_level: medium
  # models: |
  #   { ... }
  # auth: |
  #   {
  #     "provider-name": {
  #       "type": "api_key",
  #       "key": "sk-..."
  #     }
  #   }

# Per-repository configuration overrides.
# Key = owner/repo (exact match against the webhook payload).
repos:
  # "owner/repo-name":
  #   env:
  #     MY_API_KEY: "..."
  #     DEBUG: "true"
  #   nixpacks:
  #     install_cmd: "pip install -r requirements.txt"
  #     build_cmd: "npm run build"
  #     start_cmd: "python app.py"
  #
  #   # Preview build method (defaults to nixpacks auto-detection):
  #   preview:
  #     type: dockerfile             # "nixpacks", "dockerfile", or "docker-compose"
  #     dockerfile_path: Dockerfile  # path relative to repo root
  #     port: 3000                   # internal container port (default: auto-detect)
  #     build_args:                  # --build-arg passed to docker build
  #       NODE_ENV: production
  #
  #   # Or with Docker Compose:
  #   preview:
  #     type: docker-compose
  #     docker_compose_file: docker-compose.yml
  #     docker_compose_service: web  # service to expose (default: first with ports)
