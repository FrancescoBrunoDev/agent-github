# Otto configuration
listen_addr: ":9423"
webhook_path: "/webhook"
max_workers: 5
media_dir: "./media"
preview_dir: "./preview"
base_url: "https://otto.francesco-bruno.com"

github:
  app_id: 0
  installation_id: 0
  private_key_file: "/etc/otto/github-app.pem"
  webhook_secret: ""
  # Bot user for actions the GitHub App cannot perform (issue assignment, etc.)
  # Create a machine user account (e.g. @otto-bot), add it as repo collaborator,
  # and generate a classic PAT with repo scope.
  # bot_user: "otto-bot"
  # bot_token: "ghp_..."

queue:
  type: memory

pi:
  settings:
    default_provider: anthropic
    default_model: claude-sonnet-4-20250514
    default_thinking_level: medium
  # models: |
  #   {
  #     "providers": {
  #       "ollama": {
  #         "baseUrl": "http://localhost:11434/v1",
  #         "api": "openai-completions",
  #         "apiKey": "ollama",
  #         "models": [
  #           { "id": "llama3.1:8b" }
  #         ]
  #       }
  #     }
  #   }

# Per-repository configuration overrides.
# Key = owner/repo (exact match against the webhook payload).
repos:
